<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 410" width="760" height="410">
  <defs>
    <style>
      .bg { fill: #f8fafc; }
      .bar { fill: #1e293b; }
      .bar-text { font-family: system-ui, sans-serif; font-size: 13px; font-weight: 700; fill: #f8fafc; }
      .card { fill: #ffffff; stroke: #cbd5e1; stroke-width: 1.5; rx: 8; }
      .h1 { font-family: system-ui, sans-serif; font-size: 15px; font-weight: 700; fill: #0f172a; }
      .txt { font-family: system-ui, sans-serif; font-size: 12px; fill: #334155; }
      .mono { font-family: monospace; font-size: 12px; font-weight: 700; fill: #0369a1; }
      .hl { fill: #eff6ff; stroke: #2563eb; stroke-width: 2; rx: 6; }
      .hl-green { fill: #ecfdf5; stroke: #059669; stroke-width: 2; rx: 6; }
      .badge { fill: #dc2626; rx: 4; }
      .badge-txt { font-family: system-ui, sans-serif; font-size: 10px; font-weight: 700; fill: #fff; }
      .arrow { stroke: #2563eb; stroke-width: 2; fill: none; marker-end: url(#arr); }
    </style>
    <marker id="arr" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#2563eb" />
    </marker>
  </defs>

  <rect width="760" height="410" class="bg" rx="12"/>
  <rect width="760" height="44" class="bar" rx="12"/>
  <text x="20" y="27" class="bar-text">e-DEF DGI Portal (edef.dgirdc.cd/Manage) — Where NIF, e-MCF NID &amp; Token Come From</text>

  <!-- Taxpayer card -->
  <rect x="20" y="60" width="720" height="80" class="card"/>
  <text x="38" y="85" class="txt">Raison sociale:</text>
  <text x="38" y="104" class="h1">YOUR COMPANY LEGAL NAME</text>
  <rect x="36" y="112" width="190" height="22" class="hl"/>
  <text x="44" y="127" class="mono">NIF: A2220182M</text>
  <text x="242" y="127" class="txt">← Auto-extracted from Token or copy from e-DEF</text>

  <!-- Table header -->
  <rect x="20" y="155" width="720" height="115" class="card"/>
  <text x="38" y="178" class="h1" style="font-size:13px;">Active e-DEF Devices (1 Device / NID per Shop)</text>
  <line x1="35" y1="188" x2="725" y2="188" stroke="#e2e8f0"/>
  <text x="40" y="206" class="txt" style="font-weight:700;">NID (e-MCF)</text>
  <text x="175" y="206" class="txt" style="font-weight:700;">Type</text>
  <text x="255" y="206" class="txt" style="font-weight:700;">Token (Jeton)</text>
  <text x="405" y="206" class="txt" style="font-weight:700;">Point of Sale Name</text>

  <rect x="34" y="214" width="128" height="22" class="hl"/>
  <text x="42" y="229" class="mono">CD01003341-1</text>
  <rect x="175" y="216" width="48" height="18" class="badge"/><text x="199" y="228" class="badge-txt" text-anchor="middle">e-MCF</text>
  <rect x="250" y="214" width="130" height="22" class="hl-green"/>
  <text x="260" y="229" class="mono" style="fill:#047857;">e-MCF (1 jeton) eyJ...</text>
  <text x="405" y="229" class="txt" style="font-weight:700;">LA VISION (Nsele)</text>

  <rect x="34" y="241" width="128" height="22" class="hl"/>
  <text x="42" y="256" class="mono">CD01003343-1</text>
  <rect x="175" y="243" width="48" height="18" class="badge"/><text x="199" y="255" class="badge-txt" text-anchor="middle">e-MCF</text>
  <rect x="250" y="241" width="130" height="22" class="hl-green"/>
  <text x="260" y="256" class="mono" style="fill:#047857;">e-MCF (1 jeton) eyJ...</text>
  <text x="405" y="256" class="txt" style="font-weight:700;">LA VISION GOMBE</text>

  <!-- Token Decoder box -->
  <rect x="20" y="286" width="720" height="106" class="hl-green"/>
  <text x="38" y="310" class="h1" style="fill:#065f46;">How "Verify with DGI Token" in Step 2 Prevents Typos:</text>
  <text x="38" y="332" class="txt">Paste the e-DEF JWT Token (`eyJhbGci...`) into the Wizard's Token Verification helper.</text>
  <text x="38" y="352" class="mono" style="fill:#065f46;">Decoded Payload → unique_name: "A2220182M | CD01003341-1"</text>
  <text x="38" y="374" class="txt" style="font-weight:600; fill:#065f46;">✓ Automatically fills Taxpayer NIF &amp; e-MCF NID (and still allows manual editing if needed!)</text>
</svg>
